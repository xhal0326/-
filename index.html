<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🌙 운명의 별자리 사주 테스트</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Pretendard',sans-serif;
}

body{
background:
radial-gradient(circle at top,#2f215a,#120d2f,#050510);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
pointer-events:none;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
50%{opacity:.2}
}

.card{
width:100%;
max-width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.15);
padding:30px;
border-radius:25px;
box-shadow:0 0 40px rgba(180,140,255,.25);
}

h1{
text-align:center;
margin-bottom:25px;
}

input,select,button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:16px;
}

button{
background:#9c7cff;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

button:hover{
opacity:.9;
}

#result{
display:none;
margin-top:25px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,.06);
}

.resultTitle{
font-size:28px;
margin-bottom:10px;
color:#d9c4ff;
}

.tag{
display:inline-block;
padding:6px 12px;
background:#7a5cff;
border-radius:20px;
margin-bottom:15px;
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="card">

<h1>🌌 운명의 별자리 사주 테스트</h1>

<input type="number" id="year" placeholder="출생연도">

<input type="number" id="month" placeholder="출생월">

<input type="number" id="day" placeholder="출생일">

<select id="hour">
<option value="0">태어난 시각 모름</option>
<option value="1">00~01시</option>
<option value="2">02~03시</option>
<option value="3">04~05시</option>
<option value="4">06~07시</option>
<option value="5">08~09시</option>
<option value="6">10~11시</option>
<option value="7">12~13시</option>
<option value="8">14~15시</option>
<option value="9">16~17시</option>
<option value="10">18~19시</option>
<option value="11">20~21시</option>
<option value="12">22~23시</option>
</select>

<button onclick="runTest()">결과 보기</button>

<div id="result"></div>

</div>

<script>

for(let i=0;i<120;i++){
const s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.opacity=Math.random();
document.getElementById("stars").appendChild(s);
}

const prefixes=[
"달빛",
"은하",
"북두",
"유성",
"자수정",
"성운"
];

const archetypes=[
{
name:"현자",
desc:"깊은 통찰력과 분석력을 지닌 전략가입니다.",
love:"감정보다 신뢰를 중시합니다.",
match:"태양 수호자"
},
{
name:"탐험가",
desc:"새로운 경험을 사랑하는 자유로운 영혼입니다.",
love:"설렘과 모험을 추구합니다.",
match:"은하 설계자"
},
{
name:"수호자",
desc:"주변 사람을 보호하는 따뜻한 리더입니다.",
love:"안정적이고 헌신적입니다.",
match:"유성 예언가"
},
{
name:"설계자",
desc:"체계적이고 현실적인 문제 해결사입니다.",
love:"장기적인 관계를 선호합니다.",
match:"달빛 예술가"
},
{
name:"예언가",
desc:"직관과 감각이 뛰어난 이상주의자입니다.",
love:"감정 교류를 중요하게 생각합니다.",
match:"북두 현자"
},
{
name:"예술가",
desc:"감수성과 창의성이 풍부합니다.",
love:"로맨틱한 관계를 꿈꿉니다.",
match:"자수정 수호자"
},
{
name:"마법사",
desc:"상상력과 아이디어가 넘칩니다.",
love:"특별한 인연을 추구합니다.",
match:"달빛 현자"
},
{
name:"전략가",
desc:"냉철한 판단과 추진력이 강점입니다.",
love:"목표 지향적인 사랑을 합니다.",
match:"성운 예술가"
},
{
name:"치유사",
desc:"공감 능력이 뛰어난 평화주의자입니다.",
love:"상대를 있는 그대로 이해합니다.",
match:"은하 탐험가"
},
{
name:"개척자",
desc:"도전을 두려워하지 않는 혁신가입니다.",
love:"함께 성장하는 관계를 원합니다.",
match:"북두 수호자"
}
];

function runTest(){

const y=Number(document.getElementById("year").value);
const m=Number(document.getElementById("month").value);
const d=Number(document.getElementById("day").value);
const h=Number(document.getElementById("hour").value);

if(!y||!m||!d){
alert("생년월일을 입력해주세요.");
return;
}

const resultNum=(y+m+d+h)%60;

const prefix=prefixes[Math.floor(resultNum/10)];
const type=archetypes[resultNum%10];

const result=document.getElementById("result");

result.style.display="block";

result.innerHTML=`
<div class="tag">결과 번호 ${resultNum+1}/60</div>

<div class="resultTitle">
✨ ${prefix} ${type.name}형
</div>

<h3>🌟 당신의 성향</h3>
<p>${type.desc}</p>

<br>

<h3>💘 연애 스타일</h3>
<p>${type.love}</p>

<br>

<h3>🌙 운명의 궁합</h3>
<p>${type.match}</p>

<br>

<h3>🔮 해석</h3>
<p>
${prefix} ${type.name}형은 자신만의 별을 따라 움직이는 사람입니다.
타인의 기준보다 자신의 직관을 신뢰하며,
인생에서 의미 있는 관계와 경험을 중요하게 여깁니다.
주변 사람들에게는 신비롭고 매력적인 존재로 보이는 경우가 많습니다.
</p>
`;
}

</script>

</body>
</html>
